# Vérifications à chaque PR (et sur main) : types, lint, migrations et build de production.
name: Vérification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://luka:luka@localhost:5432/luka
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: luka
          POSTGRES_PASSWORD: luka
          POSTGRES_DB: luka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U luka -d luka"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installation
        run: npm ci --ignore-scripts
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migrations à jour avec le schéma
        # Échoue si src/db/schema.ts a changé sans nouvelle migration (npm run db:generate)
        run: |
          npx drizzle-kit generate --name=verification
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Le schéma a changé sans migration : lance npm run db:generate et commite le résultat."
            git status --short drizzle
            exit 1
          fi
      - name: Migrations sur une base vide
        run: node scripts/migrate.mjs
      - name: Build de production
        run: npm run build
