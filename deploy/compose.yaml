# Production de Luka, sur le serveur dans ~/luka (voir deploy/README.md).
# .env : secrets et clés des services (jamais versionné) · .version : image en ligne (écrit par deploy.sh)
# Traefik (~/traefik) sert le domaine en HTTPS d'après les labels du service web.

name: luka

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: [*logging, *hardening]
  image: ghcr.io/dzeko003/luka-web:${LUKA_VERSION:?}
  env_file: [.env]
  tmpfs:
    - /tmp
    - /app/.next/cache:uid=1000,gid=1000
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

x-app-env: &app-env
  DATABASE_URL: postgres://luka:${POSTGRES_PASSWORD:?}@db:5432/luka
  BETTER_AUTH_URL: https://${LUKA_DOMAIN:?}
  LUKA_VERSION: ${LUKA_VERSION:?} # version signalée avec les erreurs (Sentry)

services:
  db:
    <<: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: luka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: luka
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luka -d luka"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # Lancé par deploy.sh avant chaque mise en ligne, puis s'arrête
  migrate:
    <<: [*logging, *hardening]
    image: ghcr.io/dzeko003/luka-migrate:${LUKA_VERSION:?}
    environment:
      DATABASE_URL: postgres://luka:${POSTGRES_PASSWORD:?}@db:5432/luka
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    restart: "no"
    profiles: [tools]

  web:
    <<: *app
    environment:
      <<: *app-env
      LUKA_WORKER: "off" # les collectes tournent dans le service « worker »
    networks: [edge, data]
    labels:
      - traefik.enable=true
      - traefik.http.routers.luka.rule=Host(`${LUKA_DOMAIN:?}`)
      - traefik.http.routers.luka.entrypoints=websecure
      - traefik.http.routers.luka.middlewares=securite@file
      - traefik.http.services.luka.loadbalancer.server.port=3000

  # Travailleur des collectes : même image que le site, sans trafic web.
  # À l'arrêt, il termine ses collectes en cours (30 min au plus) ; deploy.sh démarre le nouveau avant.
  worker:
    <<: *app
    environment:
      <<: *app-env
      LUKA_WORKER: "on"
      NEXT_MANUAL_SIG_HANDLE: "true"
    # data : la base ; egress : accès à Internet (IA, Google Maps, sites web)
    networks: [data, egress]
    stop_grace_period: 30m

  # Sauvegarde quotidienne de la base dans ~/luka/backups (14 jours conservés)
  backup:
    <<: *logging
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/luka-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U luka luka | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "Sauvegarde : $$f"
          find /backups -name 'luka-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    restart: unless-stopped

volumes:
  db-data:

networks:
  edge:
    external: true
  data:
    internal: true
  egress:
